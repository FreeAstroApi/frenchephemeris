[package]
name = "fe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
memmap2 = "0.9"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
# Numerical code: index loops over coefficient tables, published routines with their
# original argument lists, and table-shaped tuple types read better as they are.
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
while_let_loop = "allow"
