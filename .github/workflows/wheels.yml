name: Wheels

# Builds abi3 wheels (CPython 3.9+) and the sdist on every version tag and attaches them
# to the GitHub release. Publishing to PyPI runs only when the repository variable
# PUBLISH_PYPI is "true", through PyPI trusted publishing (environment "pypi").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: macos-14, target: aarch64 }
          - { os: macos-14, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the bundled lite packs
        run: python tools/fetch_bundled_packs.py
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release -o dist
      - name: Smoke test (native targets)
        if: matrix.target == 'x64' || (runner.os == 'Linux' && matrix.target == 'x86_64') || (runner.os == 'macOS' && matrix.target == 'aarch64')
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import frenchephemeris.swe_compat as s; print(s.calc_ut(s.julday(1300, 1, 1, 0), s.MOON, 0)[0][0])"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "FrenchEphemeris ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*

  pypi:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
